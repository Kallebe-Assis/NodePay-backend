# PostgreSQL local para desenvolvimento.
# Suba com:  docker compose up -d
# Depois preencha DATABASE_URL no .env, ex.:
#   postgresql://nodepay:nodepay@localhost:5432/nodepay?schema=public
services:
  postgres:
    image: postgres:16-alpine
    container_name: nodepay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nodepay
      POSTGRES_PASSWORD: nodepay
      POSTGRES_DB: nodepay
      TZ: America/Sao_Paulo
    ports:
      - '5432:5432'
    volumes:
      - nodepay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nodepay -d nodepay']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nodepay_pgdata:

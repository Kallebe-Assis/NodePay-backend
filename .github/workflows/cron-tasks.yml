name: Tarefas agendadas (cron interno)

# Aciona as automações do NodePay (recorrências fixas, fechamento de fatura,
# lembretes, metas, backup, resumo semanal por Telegram) via POST
# /internal/cron. O backend NÃO roda essas tarefas sozinho: JOBS_ENABLED é
# false por padrão de propósito, porque o agendador interno (pg-boss)
# dependeria do processo do Render ficar acordado o tempo todo — daí a
# necessidade de algo EXTERNO batendo nesses endpoints periodicamente.
#
# Configuração necessária (uma vez): Settings → Secrets and variables →
# Actions → New repository secret:
#   API_BASE_URL   valor: https://SEU-BACKEND.onrender.com/api/v1
#   CRON_SECRET    valor: o MESMO valor da variável de ambiente CRON_SECRET
#                  configurada no serviço do Render (Settings → Environment)
#
# Sem esses secrets, o job só avisa e sai (não quebra o workflow).
#
# GitHub desativa workflows agendados depois de 60 dias sem NENHUMA
# atividade no repositório — se isso acontecer, reative em
# Actions → "Tarefas agendadas (cron interno)" → "Enable workflow".

on:
  schedule:
    # de hora em hora -> telegram-digest (ele mesmo decide se é a hora certa
    # de mandar o resumo semanal de cada usuário, conforme a preferência dele)
    - cron: '0 * * * *'
    # 1x por dia, 11:00 UTC (08:00 em America/Sao_Paulo) -> lote diário
    # (recorrências, faturas, lembretes, metas, backup, push de notificações)
    - cron: '0 11 * * *'
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Roda a(s) tarefa(s) devida(s)
        shell: bash
        run: |
          if [ -z "${{ secrets.API_BASE_URL }}" ] || [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "Secrets API_BASE_URL e/ou CRON_SECRET não definidos — nada a fazer. Veja o comentário no topo deste arquivo."
            exit 0
          fi

          run_daily() {
            echo "== lote diário (/internal/cron) =="
            curl -fsS --max-time 60 -X POST -H "x-cron-key: ${{ secrets.CRON_SECRET }}" \
              "${{ secrets.API_BASE_URL }}/internal/cron"
            echo ""
          }
          run_hourly() {
            echo "== telegram-digest (/internal/cron/telegram-digest) =="
            curl -fsS --max-time 60 -X POST -H "x-cron-key: ${{ secrets.CRON_SECRET }}" \
              "${{ secrets.API_BASE_URL }}/internal/cron/telegram-digest"
            echo ""
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Disparo manual — roda os dois pra testar."
            run_hourly
            run_daily
          elif [ "${{ github.event.schedule }}" = "0 11 * * *" ]; then
            run_daily
          else
            run_hourly
          fi
